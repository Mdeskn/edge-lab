services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/data
    network_mode: host
    restart: unless-stopped

  dashboard-backend:
    build:
      context: .
      dockerfile: dashboard/backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped

  dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - dashboard-backend
    restart: unless-stopped
