services:
  client:
    build:
      # Root context so the image can include the shared `common` package
      # alongside the client's own flat modules.
      context: .
      dockerfile: client/Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./seqam:/scenario:ro
    network_mode: host
    restart: unless-stopped

  dashboard-backend:
    build:
      context: .
      dockerfile: dashboard/backend/Dockerfile
    env_file:
      - .env
    environment:
      - DASHBOARD_SAVE_DIR=/data/saved
      - RESULTS_LOG_PATH=/data/results.csv
      - RESULTS_BY_PHASE_PATH=/data/results_by_phase.csv
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - dashboard-backend
    restart: unless-stopped
