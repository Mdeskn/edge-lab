version: "3.9"

services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.04-py3
    volumes:
      - ./triton/model_repository:/models
    command: tritonserver --model-repository=/models
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  remote-inference-api:
    build:
      context: .
      dockerfile: remote_inference/Dockerfile
    env_file:
      - .env
    environment:
      TRITON_URL: triton:8001
    ports:
      - "8100:8100"   # JPEG HTTP inference API
    depends_on:
      - triton
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  gpu-metrics-publisher:
    build:
      context: ./publishers/gpu_metrics
      dockerfile: Dockerfile
    env_file:
      - .env
    network_mode: host
    depends_on:
      - triton
    restart: unless-stopped
