server {
    listen 5173;
    server_name _;
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    # The app shell must never be served from cache. The frontend and the
    # backend share a wire protocol, so a browser holding an older app.js
    # against a newer backend degrades silently rather than failing: the
    # charts render one delta's worth of points and look like they are being
    # overwritten instead of accumulating.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|map)$ {
        try_files $uri =404;
    }

    location = /api/video-stream {
        proxy_pass http://dashboard-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api {
        proxy_pass http://dashboard-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://dashboard-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
